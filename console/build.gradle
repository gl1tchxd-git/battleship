apply plugin: 'application'

dependencies {
    implementation project(':core')
}

application {
    mainClass = 'at.gl1tchxd.battleship.ConsoleLauncher'
}

jar {
    archiveBaseName = 'battleship-console'
    manifest {
        attributes 'Main-Class': 'at.gl1tchxd.battleship.ConsoleLauncher'
    }
}

// Create a fat JAR with all dependencies
tasks.register('fatJar', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveBaseName = 'battleship-console'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'at.gl1tchxd.battleship.ConsoleLauncher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar

    // Exclude signature files that can cause corruption issues
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // Proper handling of duplicate files
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Merge service files properly
    filesMatching('META-INF/services/*') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    // Preserve native library timestamps
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}